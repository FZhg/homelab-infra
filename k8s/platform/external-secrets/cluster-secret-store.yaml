# How ESO reaches OpenBao. Auth uses ESO's own service account (Kubernetes auth method,
# configured by `make openbao-k8s-auth`). The homelab CA ConfigMap is created by `make argocd`.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: "https://192.168.1.40:8200"   # CHANGE ME: nodes.openbao.ip from inventory.yaml
      path: kv
      version: v2
      caProvider:
        type: ConfigMap
        name: homelab-ca
        namespace: external-secrets
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
