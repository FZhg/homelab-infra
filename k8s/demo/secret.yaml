# End-to-end check: kv/apps/demo in OpenBao -> Secret demo/demo-credentials.
#   kubectl -n demo get secret demo-credentials -o jsonpath='{.data.password}' | base64 -d
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-credentials
  namespace: demo
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: demo-credentials
  dataFrom:
    - extract:
        key: apps/demo
