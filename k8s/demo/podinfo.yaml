# Homepage shows the demo credentials synced from OpenBao.
#   kubectl -n demo port-forward svc/podinfo 9898:9898
#   open http://localhost:9898
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.17.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              exec ./podinfo --port=9898 \
                --ui-message="username=$(cat /config/username) password=$(cat /config/password)"
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: credentials
              mountPath: /config
              readOnly: true
      volumes:
        - name: credentials
          secret:
            secretName: demo-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: demo
spec:
  selector:
    app: podinfo
  ports:
    - name: http
      port: 9898
      targetPort: http
